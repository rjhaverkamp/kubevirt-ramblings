apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm1
  namespace: default
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: vm1
      annotations:
        k8s.v1.cni.cncf.io/networks: bridge-network1
    spec:
      domain:
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
            - name: bridge-iface
              bridge: {}
        resources:
          requests:
            memory: 1024M
            cpu: "1"
      networks:
        - name: default
          pod: {}
        - name: bridge-iface
          multus:
            networkName: bridge-network1
      volumes:
        - name: containerdisk
          containerDisk:
            image: ghcr.io/rjhaverkamp/ubuntu-2404:latest
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              password: password
              chpasswd: { expire: False }
              ssh_pwauth: True
              runcmd:
                - sudo dhcpcd
              network:
                version: 2
                ethernets:
                  enp1s0:
                    dhcp4: true
                  enp2s0:
                    dhcp4: true
